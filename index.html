.hola{font-size:13px;color:#BFD9F0;margin-top:12px}.hola b{color:#fff;font-size:16px}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:30px}
.out{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:6px 12px}
.pad{padding:12px 16px 28px}
.cta{width:100%;height:60px;background:#1F7A4A;border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 16px;color:#fff;box-shadow:0 3px 10px rgba(31,122,74,.35)}
.cta .tx{flex:1;text-align:left}.cta b{display:block;font-size:16px}.cta small{display:block;font-size:12px;color:#D6F0E1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.big{position:relative;height:172px;background:#fff;border-radius:22px;box-shadow:0 2px 12px rgba(11,60,93,.10);padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.ico{flex:none;width:44px;height:44px;border-radius:14px;background:#E3F0FA;display:flex;align-items:center;justify-content:center}
.big b{display:block;font-size:17px;color:#0B2A4A}.big small{display:block;font-size:12px;color:#4F6277;margin-top:3px;line-height:1.3}
.pill{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;color:#0B3C5D;background:#E3F0FA;border-radius:999px;padding:5px 10px}
.pill.ok{background:#DDF1E5;color:#1F7A4A}
.dot{position:absolute;right:12px;top:12px;width:16px;height:16px;border-radius:50%;background:#E5251B;border:2.5px solid #fff}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.small{position:relative;height:84px;background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(11,60,93,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px;font-size:11px;font-weight:600;text-align:center;line-height:1.2}
.small .dot{right:6px;top:6px;width:14px;height:14px}
.strip{width:100%;margin-top:12px;height:58px;background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(11,60,93,.08);display:flex;align-items:center;gap:12px;padding:0 16px;font-size:15px;font-weight:700;text-align:left}
.strip span.g{flex:1}
.bar{background:#0B3C5D;color:#fff;display:flex;align-items:center;gap:8px;padding:14px 12px;position:sticky;top:0;z-index:5}
.bar button{background:none;color:#fff;font-size:26px;line-height:1;width:36px}
.bar h1{font-size:18px;margin:0;font-weight:700}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(11,60,93,.08);padding:14px 16px;margin-bottom:10px}
label{display:block;font-size:12px;font-weight:600;color:#4F6277;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=password]{width:100%;height:46px;border:1.5px solid #D5E2EE;border-radius:12px;padding:0 12px;background:#fff;color:#0B2A4A}
input:focus{outline:none;border-color:#0B6FB5}
.btn{width:100%;height:52px;border-radius:14px;background:#0B6FB5;color:#fff;font-size:16px;font-weight:700;margin-top:16px}
.btn.green{background:#1F7A4A}.btn.ghost{background:#E3F0FA;color:#0B3C5D}.btn.red{background:#fff;color:#B3261E;border:1.5px solid #B3261E}
.btn[disabled]{background:#C9D3DD;color:#fff}
.info{background:#E3F0FA;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;color:#0B2A4A;margin-top:12px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;line-height:1.4}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#0B6FB5}
.err{color:#B3261E;font-size:13px;margin-top:8px;min-height:18px}
.login{background:#0B3C5D;min-height:100vh;color:#fff;text-align:center;padding:36px 24px}
.login img{width:150px;height:150px}.login .stf{font-size:84px;display:inline-block;margin:6px 0 18px}
.login input{text-align:center;font-size:28px;letter-spacing:10px;height:62px;border:0;border-radius:16px}
.login p{color:#BFD9F0;font-size:14px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.wk button{background:#fff;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(11,60,93,.08)}
.wk .r{text-align:center;font-weight:700;font-size:15px}
.day{display:flex;gap:12px;align-items:center}
.day .d{width:54px;text-align:center}.day .d b{display:block;font-size:12px;color:#4F6277;text-transform:uppercase}.day .d span{font-size:24px;font-weight:700}
.day .i{flex:1}.day .i b{font-size:15px}.day .i small{display:block;color:#4F6277;font-size:12px;margin-top:2px}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-bottom:4px}
.st.trabajo{background:#DDF1E5;color:#1F7A4A}.st.curso{background:#E3F0FA;color:#0B6FB5}.st.libre{background:#EEF1F4;color:#5B6B7B}.st.baja{background:#FBE4E2;color:#B3261E}.st.none{background:#EEF1F4;color:#8A97A5}
.hoy{outline:2px solid #0B6FB5}
.tot{text-align:center;font-weight:700;padding:10px;color:#0B3C5D}
.soon{text-align:center;padding:60px 24px;color:#4F6277}.soon svg{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0B2A4A;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;border-radius:22px 22px 0 0;max-width:480px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.ft{width:100%;border-collapse:collapse;font-size:13px}.ft td,.ft th{border-bottom:1px solid #E3ECF4;padding:5px 4px;text-align:center}.ft th{color:#4F6277;font-size:11px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{flex:none;background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(11,60,93,.08)}.tabs button.on{background:#0B3C5D;color:#fff}
.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.cell{height:38px;border-radius:9px;font-size:13px;font-weight:700;color:#fff}
.cell.lib{background:#1F7A4A}.cell.sel{background:#0B6FB5}.cell.oc{background:#B3261E}.cell.av{background:#E5A100}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:#4F6277;margin:10px 0;align-items:center}.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:4px;vertical-align:-2px}.leg i.lib{background:#1F7A4A}.leg i.sel{background:#0B6FB5}.leg i.oc{background:#B3261E}.leg i.av{background:#E5A100}
.sel2{width:100%;height:46px;border:1.5px solid #D5E2EE;border-radius:12px;padding:0 10px;background:#fff;color:#0B2A4A}
.seg{display:flex;gap:6px}.seg button,.cells2 button{flex:1;background:#fff;border:1.5px solid #D5E2EE;border-radius:12px;padding:12px 8px;font-weight:600;font-size:14px}.seg button.on,.cells2 button.on{background:#0B6FB5;color:#fff;border-color:#0B6FB5}
.cells2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qb{width:36px;height:36px;border-radius:10px;background:#E3F0FA;font-size:20px;font-weight:700;color:#0B3C5D}
.bar{height:58px}
#ptb{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 10px rgba(11,60,93,.15);display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:6}
#ptb button,#ptb a{flex:1;height:44px;border-radius:12px;background:#E3F0FA;color:#0B3C5D;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none}
#ptb a{flex:2.2;font-size:13px}#ptb button[disabled]{opacity:.35}
.demo{background:#E5A100;color:#fff;text-align:center;font-size:11px;font-weight:700;padding:3px}
</style>

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const pad2=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtD=d=>`${pad2(d.getDate())} ${MESES[d.getMonth()]}`;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}

let fb=null, DEMO=false;
const hasFb=()=>!!CONFIG.firebase.apiKey;
function loadScript(u){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function initFb(){
  if(fb) return fb;
  const v='10.12.2',b=`https://www.gstatic.com/firebasejs/${v}/`;
  await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-firestore-compat.js');
  firebase.initializeApp(CONFIG.firebase);
  await firebase.auth().signInAnonymously();
  fb={db:firebase.firestore(),uid:firebase.auth().currentUser.uid};
  return fb;
}
const demoWeek=(mon)=>{ // semana de ejemplo para el modo prueba
  const o={};const pat=[['trabajo','08:00','16:00','Cormorán · salida mañana'],['trabajo','08:00','16:00','Columbia II'],['curso','09:00','17:00','Curso Open Water'],['trabajo','08:00','16:00','Tienda'],['trabajo','08:00','14:00','Cormorán'],['libre'],['baja']];
  pat.forEach((p,i)=>o[iso(addDays(mon,i))]={estado:p[0],inicio:p[1]||'',fin:p[2]||'',tarea:p[3]||''});return o};
const DB={
  async login(code){
    if(code===CONFIG.demoCode){DEMO=true;return {empId:'demo',nombre:'Demo',patron:true,reparador:true}}
    if(!hasFb()) throw new Error('La app aún no está conectada al servidor.');
    const f=await initFb();
    const c=await f.db.doc('codes/'+code).get();
    if(!c.exists) throw new Error('Código incorrecto');
    const empId=c.data().empId;
    await f.db.doc('sessions/'+f.uid).set({code,empId});
    const e=await f.db.doc('employees/'+empId).get();
    return {empId,...(e.exists?e.data():{})};
  },
  async resume(s){ // reabrir sesión guardada
    if(s.empId==='demo'){DEMO=true;return {...s,patron:true,reparador:true}}
    const f=await initFb();
    await f.db.doc('sessions/'+f.uid).set({code:s.code,empId:s.empId});
    const e=await f.db.doc('employees/'+s.empId).get();
    return {...s,...(e.exists?e.data():{})};
  },
  async getPersonal(id){ if(DEMO) return lsGet('staff_personal',{}); return (await (await initFb()).db.doc('personal/'+id).get()).data()||{} },
  async setPersonal(id,d){ if(DEMO) return lsSet('staff_personal',d); await (await initFb()).db.doc('personal/'+id).set(d,{merge:true}) },
  async getWeek(id,mon){
    if(DEMO){const o=demoWeek(mon);return o}
    const f=await initFb(),o={};
    await Promise.all([0,1,2,3,4,5,6].map(async i=>{const k=iso(addDays(mon,i));const s=await f.db.doc(`schedules/${id}/days/${k}`).get();if(s.exists)o[k]=s.data()}));
    return o;
  },
  async getPlannings(){ // {AAAA-MM: url}; el panel escribe planning/{AAAA-MM} {url}
    const o={...CONFIG.planningDefault};
    if(DEMO||!hasFb()) return o;
    try{const q=await (await initFb()).db.collection('planning').get();q.forEach(d=>{if(d.data().url)o[d.id]=d.data().url})}catch(e){}
    return o},
  /* ---- fichas mensuales ---- */
  async getFicha(id,mes){
    if(DEMO){const [y,m]=mes.split('-').map(Number),n=new Date(y,m,0).getDate(),dias=[];
      for(let d=1;d<=n;d++){const w=new Date(y,m-1,d).getDay();dias.push(w===0||w===1?{d,entrada:'',salida:''}:{d,entrada:'08:00',salida:'16:00'})}
      return {empId:id,mes,dias,...lsGet('staff_ficha_'+mes,{})}}
    const x=await (await initFb()).db.doc(`fichas/${id}_${mes}`).get();return x.exists?x.data():null},
  async signFicha(id,mes,firma){
    const d={firma,firmada:true,firmadaAt:Date.now()};
    if(DEMO) return lsSet('staff_ficha_'+mes,d);
    await (await initFb()).db.doc(`fichas/${id}_${mes}`).update(d)},
  /* ---- horas extra ---- */
  async getExtras(id){
    if(DEMO) return lsGet('staff_extras',[]);
    const q=await (await initFb()).db.collection('extras').where('empId','==',id).get();
    return q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at)},
  async addExtra(id,nombre,fecha,min){
    const e={empId:id,nombre,fecha,min,estado:'pendiente',visto:true,at:Date.now()};
    if(DEMO){const l=lsGet('staff_extras',[]);e.id='d'+e.at;l.unshift(e);return lsSet('staff_extras',l)}
    await (await initFb()).db.collection('extras').add(e)},
  async seeExtras(id,list){
    if(DEMO){return lsSet('staff_extras',list.map(x=>({...x,visto:true})))}
    const f=await initFb();await Promise.all(list.filter(x=>!x.visto).map(x=>f.db.doc('extras/'+x.id).update({visto:true})))},
  async getSeen(id,key){ if(DEMO) return !!lsGet('staff_seen_'+key,false); return (await (await initFb()).db.doc(`schedules/${id}/seen/${key}`).get()).exists },
  async setSeen(id,key){ if(DEMO) return lsSet('staff_seen_'+key,true); await (await initFb()).db.doc(`schedules/${id}/seen/${key}`).set({at:Date.now()}) },
  async aviso(id,nombre,key){ if(DEMO) return; await (await initFb()).db.collection('avisos').add({empId:id,nombre,semana:key,at:Date.now(),tipo:'no_puedo_ir',leido:false}) }
};

/* ---------- PLANNING (hoja de Google incrustada) ---------- */
let planMes=null,planZoom=1;
const MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function sheetEmbed(u){ // convierte el enlace de edición en vista incrustable con pestañas
  const m=u.match(/spreadsheets\/d\/([^\/]+)/);if(!m)return u;
  return `https://docs.google.com/spreadsheets/d/${m[1]}/htmlview?rm=minimal`;
}
async function screenPlanning(el){

  const old=$('#ptb');if(old)old.remove();
  el.innerHTML='<div class="soon">Cargando…</div>';

  if(!planMes||!P[planMes]){const n=new Date(),k=`${n.getFullYear()}-${pad2(n.getMonth()+1)}`;planMes=P[k]?k:keys[keys.length-1]}

  root.appendChild(tb);

  $('#fs').onclick=async()=>{const bx=$('#pbox');try{await bx.requestFullscreen();if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){toast('Gira el móvil para verlo en horizontal')}};

/* ---------- FIRMAR JORNADA (ficha mensual) ---------- */
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
const isLastDay=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate()===d.getDate();
async function pendingFicha(id){ // mes pendiente de firma: el actual si es último día, o el anterior sin firmar
  const n=new Date(),prev=new Date(n.getFullYear(),n.getMonth()-1,1),cands=[];
  if(isLastDay(n))cands.push(ymd(n));cands.push(ymd(prev));
  for(const mes of cands){try{const f=await DB.getFicha(id,mes);if(f&&!f.firmada)return mes}catch(e){}}
  return null}
async function screenFirmar(el,ctx){
  if(!habil(ctx,'puedeFirmar'))return noAct(el);
  const id=ctx.user.empId;el.innerHTML='<div class="soon">Cargando…</div>';
  const pend=await pendingFicha(id),mes=pend||ymd(new Date());
  let f=null;try{f=await DB.getFicha(id,mes)}catch(e){}
  if(!f){el.innerHTML='<div class="soon">Todavía no hay ficha de este mes.<br>La prepara la empresa.</div>';return}
  const [y,m]=mes.split('-');
  const filas=f.dias.map(r=>`<tr><td>${r.d}</td><td>${esc(r.entrada||'')}</td><td>${esc(r.salida||'')}</td></tr>`).join('');
  const tot=f.dias.reduce((a,r)=>a+hrs(r.entrada,r.salida),0);
  el.innerHTML=`<div class="card"><b style="text-transform:capitalize">${MESES_L[+m-1]} ${y}</b><div style="font-size:12px;color:#4F6277;margin:2px 0 8px">Registro de jornada (solo lectura)</div>
  <table class="ft"><tr><th>Día</th><th>Entrada</th><th>Salida</th></tr>${filas}</table><div class="tot">Total: ${Math.round(tot*100)/100} h</div></div>`+
  (f.firmada?`<div class="info" style="background:#DDF1E5">Ficha firmada ✓</div>${f.firma?`<img src="${f.firma}" style="max-width:100%;background:#fff;border-radius:12px;margin-top:10px">`:''}`
   : !pend?`<div class="info">Podrás firmar esta ficha el último día del mes.</div>`
   :`<label>Firma del trabajador</label><canvas id="sg" width="640" height="240" style="width:100%;height:120px;background:#fff;border:1.5px solid #D5E2EE;border-radius:12px;touch-action:none"></canvas>
     <button class="btn ghost" id="lp" style="height:40px;margin-top:8px">Borrar firma</button><div class="err" id="er"></div><button class="btn green" id="fm">FIRMAR JORNADA</button>`);
  if(f.firmada||!pend)return;
  const cv=$('#sg'),cx=cv.getContext('2d');let dr=false,any=false;
  cx.lineWidth=4;cx.lineCap='round';cx.strokeStyle='#0B2A4A';
  const pos=e=>{const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*cv.width/r.width,(t.clientY-r.top)*cv.height/r.height]};
  const st=e=>{e.preventDefault();dr=true;const[x,y]=pos(e);cx.beginPath();cx.moveTo(x,y)},mv=e=>{if(!dr)return;e.preventDefault();const[x,y]=pos(e);cx.lineTo(x,y);cx.stroke();any=true},en=()=>{dr=false};
  cv.addEventListener('pointerdown',st);cv.addEventListener('pointermove',mv);addEventListener('pointerup',en);
  $('#lp').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);any=false};
  $('#fm').onclick=async()=>{
    if(!any)return $('#er').textContent='Dibuja tu firma.';
    if(!await confirm2('¿Firmar la jornada de este mes?','Segunda confirmación: la firma queda registrada y no se puede cambiar.'))return;
    try{await DB.signFicha(id,mes,cv.toDataURL('image/png'));ctx.flags.firmar=false;toast('Jornada firmada');screenFirmar(el,ctx)}catch(e){$('#er').textContent='No se pudo firmar. Revisa la conexión.'}};
}

/* ---------- HORAS EXTRAS ---------- */
const fmtMin=m=>`${Math.floor(m/60)} h${m%60?' '+pad2(m%60)+' min':''}`;
async function screenExtras(el,ctx){
  const id=ctx.user.empId;el.innerHTML='<div class="soon">Cargando…</div>';

const COL={

    let r;
    if(DEMO) r=lsGet('staff_c_'+name,[]).filter(x=>!where||x[where[0]]===where[1]);
    else{let q=(await initFb()).db.collection(name);if(where)q=q.where(where[0],'==',where[1]);r=(await q.get()).docs.map(d=>({id:d.id,...d.data()}))}
    r.forEach(x=>{if(x.ts&&x.ts.toMillis)x.ts=x.ts.toMillis()});return r},
  async add(name,o){
    o={...o,at:Date.now()};
    if(DEMO){const l=lsGet('staff_c_'+name,[]);o.id='d'+Date.now()+Math.random().toString(36).slice(2,6);if(o.ts==='SERVER')o.ts=Date.now();l.push(o);lsSet('staff_c_'+name,l);return o}

let gpsW=null,gps={v:0,d:0,last:null};
function gpsStop(){if(gpsW!=null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsW);gpsW=null}
function gpsStart(){
  gpsStop();gps={v:0,d:0,last:null};if(!navigator.geolocation)return;
  gpsW=navigator.geolocation.watchPosition(p=>{
    const c=p.coords;gps.v=c.speed!=null?c.speed*3.6:0;
    if(gps.last){const R=6371,r=x=>x*Math.PI/180,a=r(c.latitude-gps.last.lat),b=r(c.longitude-gps.last.lon),h=Math.sin(a/2)**2+Math.cos(r(gps.last.lat))*Math.cos(r(c.latitude))*Math.sin(b/2)**2;const dd=2*R*Math.asin(Math.sqrt(h));if(dd>0.003)gps.d+=dd}
    gps.last={lat:c.latitude,lon:c.longitude};const e=$('#gpsb');if(e)e.textContent=`${gps.v.toFixed(1)} km/h · ${gps.d.toFixed(2)} km`},()=>{},{enableHighAccuracy:true,maximumAge:2000});
}

    $('#vl').onclick=()=>bitaMenu(el,ctx);
    $('#ac').onclick=async()=>{sv();const pp=pts.length?S.p:(S.pl?S.pl.split(',').map(x=>x.trim()).filter(Boolean).slice(0,2):[]);
      if(!S.barco)return $('#er').textContent='Elige el barco.';if(S.rep&&(!S.lt||!S.eu))return $('#er').textContent='Indica litros y euros.';
      if(!pp.length)return $('#er').textContent='Elige al menos un punto.';if(!S.m[2])return $('#er').textContent='Indica los minutos de regreso.';
      if(S.rut.length<rut.length)return $('#er').textContent='Marca todas las rutinas de cierre.';
      try{await COL.add('bitacora',{empId:ctx.user.empId,nombre:ctx.user.nombre||'',fecha:iso(fecha),barco:S.barco,repostaje:S.rep?{litros:+S.lt,euros:+S.eu}:null,zona:S.zona,puntos:pp,min:S.m,rutinas:rut,km:+gps.d.toFixed(2)});toast('Salida guardada');bitaMenu(el,ctx)}catch(e){$('#er').textContent='No se pudo guardar.'}};
  };dr();
}
function bitaMant(el,ctx){
  el.innerHTML=`<div class="card"><label style="margin-top:0">Barco</label><select id="mb" class="sel2">${BARCOS.map(b=>`<option>${b}</option>`).join('')}</select><label>Tipo</label><select id="mt" class="sel2">${MANT.map(b=>`<option>${b}</option>`).join('')}</select>
  <label>Horas de motor</label><input type="number" id="mh"><label>Próximo mantenimiento (horas de motor)</label><input type="number" id="mn"><label>Notas</label><input type="text" id="mo">
  <div class="err" id="er"></div><button class="btn green" id="ms">GUARDAR</button><button class="btn ghost" id="vl">Volver</button></div>`;
  $('#vl').onclick=()=>bitaMenu(el,ctx);
  $('#ms').onclick=async()=>{if(!$('#mh').value)return $('#er').textContent='Indica las horas de motor.';
    try{await COL.add('mantenimiento',{empId:ctx.user.empId,nombre:ctx.user.nombre||'',fecha:iso(new Date()),barco:$('#mb').value,tipo:$('#mt').value,horas:+$('#mh').value,proximo:+$('#mn').value||null,notas:$('#mo').value});toast('Mantenimiento guardado');bitaMenu(el,ctx)}catch(e){$('#er').textContent='No se pudo guardar.'}};
}
async function bitaHist(el,ctx){
  el.innerHTML='<div class="soon">Cargando…</div>';let B=[],M=[];
  try{[B,M]=await Promise.all([COL.list('bitacora',['empId',ctx.user.empId]),COL.list('mantenimiento',['empId',ctx.user.empId])])}catch(e){}
  B.sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.at-a.at);M.sort((a,b)=>b.at-a.at);
  el.innerHTML=`<button class="btn ghost" id="vl" style="margin-top:0">Volver</button><label>Salidas</label>${B.length?B.map(x=>`<div class="card"><b>${x.fecha} · ${esc(x.barco)}</b><div style="font-size:13px;color:#4F6277">${esc((x.puntos||[]).join(' / '))} · ${x.zona==='bahia'?'Bahía':'Reserva'} · ${(x.min||[]).reduce((a,b)=>a+(b||0),0)} min${x.repostaje?` · ${x.repostaje.litros} l / ${x.repostaje.euros} €`:''}${x.km?` · ${x.km} km`:''}</div></div>`).join(''):'<div class="card" style="color:#4F6277">Sin salidas</div>'}
  <label>Mantenimiento</label>${M.length?M.map(x=>`<div class="card"><b>${x.fecha} · ${esc(x.barco)} · ${esc(x.tipo)}</b><div style="font-size:13px;color:#4F6277">${x.horas} h motor${x.proximo?` · próximo a las ${x.proximo} h`:''}</div></div>`).join(''):'<div class="card" style="color:#4F6277">Sin registros</div>'}`;
  $('#vl').onclick=()=>bitaMenu(el,ctx);
}

/* ---------- RANKING DE RESEÑAS ---------- */
async function screenRanking(el,ctx){
  el.innerHTML='<div class="soon">Cargando…</div>';let R=[];try{R=await COL.list('ranking')}catch(e){}
  R.sort((a,b)=>(b.puntos||0)-(a.puntos||0));
  const mi=R.findIndex(x=>x.id===ctx.user.empId||x.empId===ctx.user.empId),med=['🥇','🥈','🥉'];
  let pique='';if(mi>0){const d=(R[mi-1].puntos||0)-(R[mi].puntos||0);pique=`<div class="info" style="background:#FFF1D6">Te faltan <b>${d+1}</b> reseñas para adelantar a <b>${esc(R[mi-1].nombre)}</b> 👀</div>`}else if(mi===0&&R.length>1)pique=`<div class="info" style="background:#DDF1E5">¡Vas primero! <b>${esc(R[1].nombre)}</b> te pisa los talones.</div>`;
  el.innerHTML=`<div class="info" style="margin-top:0">🎁 A fin de mes, premio sorpresa para quien más reseñas consiga.</div>${pique}<div style="margin-top:12px"></div>`+
   (R.length?R.map((x,i)=>`<div class="card day ${i===mi?'hoy':''}"><div class="d"><span>${med[i]||i+1}</span></div><div class="i"><b>${esc(x.nombre)}</b></div><b style="font-size:20px;color:#0B3C5D">${x.puntos||0}</b></div>`).join(''):'<div class="soon">Todavía no hay puntuaciones.</div>');
}

/* ---------- COMISIONES (10%) ---------- */
async function screenComisiones(el,ctx){
  const id=ctx.user.empId;el.innerHTML='<div class="soon">Cargando…</div>';let L=[];try{L=await COL.list('comisiones',['empId',id])}catch(e){}
  L.sort((a,b)=>b.at-a.at);const sum=e=>L.filter(x=>x.estado===e).reduce((a,x)=>a+x.comision,0),eur=n=>n.toFixed(2).replace('.',',')+' €';
  el.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:12px;color:#4F6277">A cobrar a fin de mes (aprobadas)</div><div style="font-size:32px;font-weight:700;color:#1F7A4A">${eur(sum('aprobada'))}</div><div style="font-size:12px;color:#4F6277">Pendientes de aprobar: ${eur(sum('pendiente'))}</div></div>
  <div class="card"><label style="margin-top:0">Producto</label><input type="text" id="cp"><label>Importe (€)</label><input type="number" id="ci" step="0.01" inputmode="decimal"><div style="margin:6px 0;font-weight:700;color:#1F7A4A">Tu comisión (10%): <span id="cc">0,00 €</span></div><label>Cliente</label><input type="text" id="cn"><div class="err" id="er"></div><button class="btn green" id="cs">ANOTAR VENTA</button></div>
  ${L.length?'<label>Mis ventas</label>'+L.map(x=>`<div class="card day" style="${x.estado==='pagada'?'opacity:.5;filter:grayscale(1)':''}"><div class="i"><b>${esc(x.producto)}</b><small>${esc(x.cliente)} · ${eur(x.importe)}</small></div><div style="text-align:right"><b>${eur(x.comision)}</b><div><span class="st ${x.estado==='aprobada'?'trabajo':x.estado==='pagada'?'libre':'curso'}">${x.estado==='aprobada'?'Aprobada':x.estado==='pagada'?'Pagada':'Pendiente'}</span></div></div></div>`).join(''):''}`;
  $('#ci').oninput=()=>{$('#cc').textContent=eur((+$('#ci').value||0)*0.1)};
  $('#cs').onclick=async()=>{const p=$('#cp').value.trim(),i=+$('#ci').value,c=$('#cn').value.trim();if(!p||!i||!c)return $('#er').textContent='Rellena producto, importe y cliente.';
    try{await COL.add('comisiones',{empId:id,nombre:ctx.user.nombre||'',producto:p,importe:i,cliente:c,comision:Math.round(i*10)/100,estado:'pendiente'});toast('Venta anotada');screenComisiones(el,ctx)}catch(e){$('#er').textContent='No se pudo guardar.'}};
}

/* ---------- MI SEMANA ---------- */
let weekMon=mondayOf(new Date());
const hrs=(a,b)=>{if(!a||!b)return 0;const[h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);return Math.max(0,(h2*60+m2-h1*60-m1)/60)};
const ESTADOS={trabajo:'Trabajo',curso:'Curso / Tarea especial',libre:'Libre / Descanso',baja:'Baja / Ausencia'};
async function screenSemana(el,ctx){
  const id=ctx.user.empId,key=iso(weekMon);
  el.innerHTML='<div class="soon">Cargando…</div>';
  let w={},seen=false;
  try{[w,seen]=await Promise.all([DB.getWeek(id,weekMon),DB.getSeen(id,key)])}catch(e){}
  let tot=0,html='';
  for(let i=0;i<7;i++){
    const d=addDays(weekMon,i),x=w[iso(d)]||{},est=x.estado||'none';
    let h=hrs(x.inicio,x.fin)+hrs(x.inicio2,x.fin2);if(est==='trabajo'||est==='curso')tot+=h;
    const horas=x.inicio&&x.fin?`${x.inicio} – ${x.fin}`+(x.inicio2?` y ${x.inicio2} – ${x.fin2}`:''):'';
    html+=`<div class="card day ${iso(d)===iso(new Date())?'hoy':''}"><div class="d"><b>${DIAS[i]}</b><span>${d.getDate()}</span></div><div class="i"><span class="st ${est}">${ESTADOS[est]||'Sin asignar'}</span>${horas?`<div><b>${horas}</b></div>`:''}${x.tarea?`<small>${esc(x.tarea)}</small>`:''}</div></div>`;
  }
  el.innerHTML=`<div class="wk"><button id="pv">‹ Anterior</button><div class="r">${fmtD(weekMon)} – ${fmtD(addDays(weekMon,6))}</div><button id="nx">Siguiente ›</button></div>
  <button class="btn ghost" style="margin:0 0 12px;height:42px" id="hy">Hoy</button>${html}
  <div class="tot">HORAS DE LA SEMANA: ${Math.round(tot*100)/100} h</div>
  <button class="btn green" id="vs" ${seen?'disabled':''}>${seen?'VISTO ✓':'VISTO ✓'}</button>
  <button class="btn red" id="av">AVISAR: NO PUEDO IR</button>`;
  const re=()=>screenSemana(el,ctx);
  $('#pv').onclick=()=>{weekMon=addDays(weekMon,-7);re()};$('#nx').onclick=()=>{weekMon=addDays(weekMon,7);re()};$('#hy').onclick=()=>{weekMon=mondayOf(new Date());re()};
  $('#vs').onclick=async()=>{try{await DB.setSeen(id,key);toast('Marcado como visto');re()}catch(e){toast('No se pudo guardar')}};
  $('#av').onclick=async()=>{if(!confirm('¿Avisar a la empresa de que no puedes ir esta semana?'))return;try{await DB.aviso(id,ctx.user.nombre||'',key);toast('Aviso enviado')}catch(e){toast('No se pudo enviar')}};
}
